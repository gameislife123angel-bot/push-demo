<!DOCTYPE html>
<html>
<head>
  <title>Push Notification Demo</title>
</head>
<body>
  <h2>GitHub Push Notification Demo</h2>
  <button onclick="requestPermission()">Enable Notifications</button>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBH7IBcB2DVRqkNNmER9y84BWkmyR0b3HU",
      authDomain: "github-push-demo.firebaseapp.com",
      projectId: "github-push-demo",
      messagingSenderId: "598003719674",
      appId: "1:598003719674:web:8335b3304f6e62ee9e1843"
    };

    firebase.initializeApp(firebaseConfig);

    const messaging = firebase.messaging();
    let swRegistration = null;

    // ✅ MANUAL service worker registration
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("/push-demo/firebase-messaging-sw.js")
        .then((registration) => {
          console.log("✅ Service Worker registered");
          swRegistration = registration;
        })
        .catch((err) => {
          console.error("❌ SW registration failed", err);
        });
    }

    // ✅ Request permission + explicitly use OUR service worker
    function requestPermission() {
      Notification.requestPermission().then((permission) => {
        if (permission !== "granted") {
          alert("Permission denied");
          return;
        }

        messaging.getToken({
          vapidKey: "BA8imDaZdZhl3yVAvu6qYrsx352s7r-x5b380ou1ONLjrS4hN0fGin3uRp4x4z6gqhGUZk_4PEodpLAZgENNoio",
          serviceWorkerRegistration: swRegistration
        })
        .then((token) => {
          console.log("🔥 FCM TOKEN:", token);
          alert("Notifications enabled! Check console.");
        })
        .catch((err) => {
          console.error("❌ Token error", err);
        });
      });
    }

    messaging.onMessage((payload) => {
      console.log("📩 Foreground message:", payload);
    });
  </script>
</body>
</html>
